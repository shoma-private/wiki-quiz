<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わたしのカフェ地図</title>
<meta name="theme-color" content="#F3F4EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カフェ地図">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 1画面アプリ：上に検索、中央に地図/リスト、下からお店シート */
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --ink:#26221E; --muted:#6F6A63; --line:#E2E1DA;
  --berry:#B8406A; --berry-soft:#F7E3EA;
  --open:#2E8A57; --open-soft:#E1F1E7; --closed:#8E8880; --unknown:#B9B3AA;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --shadow:0 6px 24px rgba(38,34,30,.14);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1C1A18; --surface:#272421; --ink:#F1ECE6; --muted:#A9A29A; --line:#3A3632;
  --berry:#E7779D; --berry-soft:#3D2630;
  --open:#5CC48A; --open-soft:#1F3428; --closed:#8E8880; --unknown:#6B655E;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;background:var(--bg);z-index:5}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font:700 19px/1.2 var(--display);margin:0;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;outline:none;font-size:16px}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.open[aria-pressed="true"]{background:var(--open);border-color:var(--open);color:#fff}
.chip.saved[aria-pressed="true"]{background:var(--berry);border-color:var(--berry);color:#fff}

main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--line)}
#list{position:absolute;inset:0;overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:13px;z-index:500;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.redo{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:450;border:0;background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:700;white-space:nowrap}

.card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.card .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.card .body{flex:1;min-width:0}
.card .name{font:700 15px/1.4 var(--display);margin:0;overflow-wrap:anywhere}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.card .dist{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.st-open{color:var(--open);font-weight:500}
.dot.open{background:var(--open)} .dot.closed{background:var(--closed)} .dot.unknown{background:var(--unknown)}
.heart{color:var(--berry);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:40px 8px;line-height:1.8}
.empty b{display:block;color:var(--ink);font:700 16px var(--display);margin-bottom:4px}

/* 地図ピン */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font-size:12px;font-weight:700;line-height:1}
.pin.open{background:var(--open)} .pin.closed{background:var(--closed)} .pin.unknown{background:var(--unknown)}
.pin.saved{background:var(--berry)}
.pin.dim{opacity:.55}
.me{width:16px;height:16px;border-radius:50%;background:#2F7BEA;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,234,.22)}
.leaflet-container{font:inherit}

/* お店シート */
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.35);z-index:900}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--surface);border-radius:20px 20px 0 0;max-height:86%;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.iconbtn.busy svg{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font:700 20px/1.35 var(--display);margin:0 0 2px;overflow-wrap:anywhere;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.love{background:var(--berry);border-color:var(--berry);color:#fff}
.sec{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.hours{display:grid;grid-template-columns:2em 1fr;gap:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.hours .today{font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12.5px}
.stars{display:flex;align-items:center;gap:10px}
.stars label{width:5.5em;font-size:13px}
.stars .s{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:24px;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:var(--berry)}
.status3{display:flex;gap:6px}
.status3 button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:500}
.status3 button[aria-pressed="true"]{background:var(--berry-soft);border-color:var(--berry);color:var(--berry);font-weight:700}
textarea,.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px;resize:vertical}
.small{font-size:12px;color:var(--muted)}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.confirm button{border:1px solid var(--berry);color:var(--berry);background:none;border-radius:8px;padding:5px 10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>わたしのカフェ地図</h1><small id="where">現在地を確認中…</small></div>
    <form class="searchrow" id="searchForm" autocomplete="off">
      <label class="search" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="駅名・地名で探す（例：下北沢）" enterkeyhint="search">
      </label>
      <button type="button" class="iconbtn" id="locBtn" aria-label="現在地まわりを探す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
      </button>
    </form>
    <div class="controls">
      <div class="seg" role="group" aria-label="表示切り替え">
        <button id="vMap" aria-pressed="true">地図</button>
        <button id="vList" aria-pressed="false">リスト</button>
      </div>
      <div class="chips" role="group" aria-label="しぼりこみ">
        <button class="chip open" id="fOpen" aria-pressed="false">今あいてる</button>
        <button class="chip saved" id="fSaved" aria-pressed="false">♥ 保存した店</button>
        <button class="chip" id="fSweets" aria-pressed="false">ケーキ・スイーツ</button>
        <button class="chip" id="fRadius" aria-pressed="false">半径 1km</button>
      </div>
    </div>
  </header>
  <main>
    <div id="map"></div>
    <div id="list" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <button class="redo" id="redo" hidden>このあたりで探す</button>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="hours.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const KEY = "cafemap.v1";
const FALLBACK = { lat: 35.4887, lon: 139.4069, name: "座間駅" }; // 位置情報が使えないときの初期位置
const RADII = [500, 1000, 2000];
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];

// ---------- 保存データ ----------
let store = { saved: {}, radius: 1000 };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.saved) store = Object.assign(store, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { toast("保存できませんでした（ブラウザの保存領域がいっぱいかも）"); } };

// ---------- 状態 ----------
let center = null;        // 検索の中心 {lat,lon}
let me = null;            // 現在地
let found = [];           // 検索結果
let view = "map";
const filters = { open: false, saved: false, sweets: false };

// ---------- 地図 ----------
const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([FALLBACK.lat, FALLBACK.lon], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const layer = L.layerGroup().addTo(map);
let meMarker = null, ring = null;
map.on("moveend", () => {
  if (!center) return;
  const c = map.getCenter();
  $("redo").hidden = view !== "map" || distance(center, { lat: c.lat, lon: c.lng }) < store.radius * 0.6;
});

// ---------- 小物 ----------
function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms);
}
function distance(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const fmtDist = (m) => (m < 1000 ? `${Math.round(m / 10) * 10}m` : `${(m / 1000).toFixed(1)}km`);
const walk = (m) => `徒歩${Math.max(1, Math.round(m / 80))}分`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function cafeFromOSM(el) {
  const t = el.tags || {};
  const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
  return {
    id: `${el.type}/${el.id}`,
    name: t["name:ja"] || t.name || "名前のないカフェ",
    lat, lon,
    hours: t.opening_hours || "",
    cuisine: t.cuisine || "",
    addr: [t["addr:province"], t["addr:city"], t["addr:quarter"], t["addr:neighbourhood"], t["addr:block_number"]].filter(Boolean).join(""),
    outdoor: t.outdoor_seating === "yes",
    takeaway: t.takeaway === "yes",
    wifi: t.internet_access === "wlan" || t.internet_access === "yes",
    smoking: t.smoking || "",
    web: t.website || t["contact:website"] || "",
    insta: t["contact:instagram"] || "",
    brand: t.brand || "",
  };
}
const isSweets = (c) => /cake|dessert|pastry|crepe|pancake|ice_cream|donut|bakery|sweet|parfait|tart|chocolate|waffle/i.test(c.cuisine)
  || /ケーキ|パティスリー|スイーツ|パフェ|クレープ|パンケーキ|甘味|タルト|ドーナツ/.test(c.name);
const savedOf = (c) => store.saved[c.id];
const stOf = (c) => CafeHours.status(c.hours, new Date());

// ---------- 検索 ----------
async function searchCafes(pt) {
  center = pt; $("redo").hidden = true;
  const q = `[out:json][timeout:25];nwr["amenity"="cafe"](around:${store.radius},${pt.lat},${pt.lon});out center tags 150;`;
  const btn = $("locBtn"); btn.classList.add("busy");
  toast("カフェを探しています…", 20000);
  let data = null;
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(q), headers: { "Content-Type": "application/x-www-form-urlencoded" } });
      if (r.ok) { data = await r.json(); break; }
    } catch (e) {}
  }
  btn.classList.remove("busy");
  if (!data) { toast("お店情報を取れませんでした。電波のいい所でもう一度ためしてね", 4000); render(); return; }
  found = data.elements.map(cafeFromOSM).filter((c) => c.lat != null);
  // 保存済みの店は最新の営業時間で更新
  for (const c of found) if (store.saved[c.id]) Object.assign(store.saved[c.id].info, c);
  persist();
  const n = found.length;
  toast(n ? `${n}軒みつかりました` : "この範囲にはカフェが見つかりませんでした。半径を広げてみてね");
  ring && ring.remove();
  ring = L.circle([pt.lat, pt.lon], { radius: store.radius, color: getCss("--berry"), weight: 1, fillOpacity: 0.04, dashArray: "4 6" }).addTo(map);
  render();
}
const getCss = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function locate() {
  if (!navigator.geolocation) { noLocation(); return; }
  $("where").textContent = "現在地を確認中…";
  $("locBtn").classList.add("busy");
  navigator.geolocation.getCurrentPosition((p) => {
    me = { lat: p.coords.latitude, lon: p.coords.longitude };
    $("where").textContent = "現在地のまわり";
    meMarker && meMarker.remove();
    meMarker = L.marker([me.lat, me.lon], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false }).addTo(map);
    map.setView([me.lat, me.lon], store.radius > 1000 ? 14 : 15);
    searchCafes(me);
  }, () => { $("locBtn").classList.remove("busy"); noLocation(); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}
function noLocation() {
  $("where").textContent = `${FALLBACK.name}のまわり`;
  toast("位置情報が使えないので、上の検索で地名を入れてね", 4000);
  map.setView([FALLBACK.lat, FALLBACK.lon], 15);
  searchCafes(FALLBACK);
}
async function geocode(text) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q=${encodeURIComponent(text)}`);
    const j = await r.json();
    if (!j.length) { toast(`「${text}」が見つかりませんでした`); return; }
    const pt = { lat: +j[0].lat, lon: +j[0].lon };
    $("where").textContent = `${text}のまわり`;
    map.setView([pt.lat, pt.lon], store.radius > 1000 ? 14 : 15);
    searchCafes(pt);
  } catch (e) { toast("地名検索に失敗しました。もう一度ためしてね"); }
}

// ---------- 表示 ----------
function visible() {
  // 検索結果＋（保存した店フィルタ時は）範囲外の保存店も
  const byId = new Map(found.map((c) => [c.id, c]));
  if (filters.saved) for (const s of Object.values(store.saved)) if (!byId.has(s.info.id)) byId.set(s.info.id, s.info);
  let list = [...byId.values()];
  if (filters.saved) list = list.filter(savedOf);
  if (filters.open) list = list.filter((c) => stOf(c).state === "open");
  if (filters.sweets) list = list.filter((c) => isSweets(c) || savedOf(c)?.sweets);
  const ref = me || center;
  list.forEach((c) => (c._d = ref ? distance(ref, c) : 0));
  // 保存→営業中→距離の順
  const rank = (c) => (savedOf(c) ? 0 : 2) + (stOf(c).state === "open" ? 0 : 1);
  return list.sort((a, b) => rank(a) - rank(b) || a._d - b._d);
}

function render() {
  const list = visible();
  // 地図
  layer.clearLayers();
  for (const c of list) {
    const st = stOf(c).state, sv = savedOf(c);
    const cls = sv ? "saved" + (st === "closed" ? " dim" : "") : st;
    const icon = L.divIcon({ className: "", html: `<div class="pin ${cls}"><span>${sv ? "♥" : ""}</span></div>`, iconSize: [26, 26], iconAnchor: [4, 26] });
    L.marker([c.lat, c.lon], { icon, title: c.name, zIndexOffset: sv ? 500 : st === "open" ? 200 : 0 }).on("click", () => openSheet(c)).addTo(layer);
  }
  // リスト
  const L_ = $("list");
  if (!list.length) {
    const why = filters.saved && !Object.keys(store.saved).length
      ? "<b>まだ保存したお店はありません</b>気になるお店を開いて「行きたい」を押すと、ここに集まります"
      : found.length ? "<b>条件に合うお店がありません</b>しぼりこみを外すか、半径を広げてみてね"
      : "<b>カフェを探しましょう</b>右上の現在地ボタンか、地名検索から";
    L_.innerHTML = `<p class="empty">${why}</p>`;
  } else {
    L_.innerHTML = list.map((c, i) => {
      const st = stOf(c), sv = savedOf(c);
      const extra = [sv ? `<span class="heart">♥ ${sv.status === "been" ? "行った" : "行きたい"}${sv.taste ? " · 味" + "★".repeat(sv.taste) : ""}</span>` : "", isSweets(c) ? "スイーツ" : ""].filter(Boolean).join("");
      return `<button class="card" data-i="${i}"><span class="dot ${st.state}"></span><span class="body"><p class="name">${esc(c.name)}</p><span class="meta"><span class="${st.state === "open" ? "st-open" : ""}">${esc(st.label)}</span>${extra ? `<span>${extra}</span>` : ""}</span></span><span class="dist">${c._d ? fmtDist(c._d) : ""}</span></button>`;
    }).join("");
    L_.querySelectorAll(".card").forEach((b) => b.addEventListener("click", () => openSheet(list[+b.dataset.i])));
  }
}

// ---------- お店シート ----------
let current = null, askDelete = false;
function openSheet(c) { current = c; askDelete = false; drawSheet(); $("scrim").hidden = false; $("sheet").hidden = false; }
function closeSheet() { $("scrim").hidden = true; $("sheet").hidden = true; current = null; render(); }
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && current) closeSheet(); });

function gmapsUrl(c) {
  const q = c.addr ? `${c.name} ${c.addr}` : `${c.name} ${c.lat},${c.lon}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}
function drawSheet() {
  const c = current, st = stOf(c), sv = savedOf(c);
  const ref = me || center; const d = ref ? distance(ref, c) : 0;
  const tbl = CafeHours.table(c.hours);
  const today = (new Date().getDay() + 6) % 7;
  const tags = [isSweets(c) && "スイーツ", c.outdoor && "テラス席", c.takeaway && "テイクアウト", c.wifi && "Wi-Fi",
    c.smoking === "no" && "禁煙", c.brand && "チェーン店"].filter(Boolean);
  const stars = (key, label) => `<div class="stars"><label>${label}</label><span class="s" role="group" aria-label="${label}">${[1,2,3,4,5].map((n) =>
    `<button data-k="${key}" data-n="${n}" class="${(sv?.[key] || 0) >= n ? "on" : ""}" aria-label="${label} ${n}">★</button>`).join("")}</span></div>`;
  $("sheet").innerHTML = `
    <div class="grab"></div>
    <h2 id="sheetTitle">${esc(c.name)}</h2>
    <div class="sub"><span class="${st.state === "open" ? "st-open" : ""}">${esc(st.label)}</span>${d ? ` · ${fmtDist(d)}（${walk(d)}）` : ""}</div>
    <div class="row">
      <a class="btn primary" href="${gmapsUrl(c)}" target="_blank" rel="noopener">Googleマップで開く</a>
      <button class="btn ${sv ? "love" : ""}" id="saveBtn">${sv ? "♥ 保存済み" : "♡ 行きたい"}</button>
    </div>
    ${tags.length ? `<div class="sec"><div class="tags">${tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div></div>` : ""}
    <div class="sec"><h3>営業時間</h3>
      ${tbl ? `<div class="hours">${tbl.map((r, i) => `<span class="${i === today ? "today" : ""}">${r.day}</span><span class="${i === today ? "today" : ""}">${r.text}</span>`).join("")}</div>
        <p class="small">地図データの情報です。臨時休業などはGoogleマップで確認してね</p>`
      : `<p class="small">${c.hours ? `登録情報：${esc(c.hours)}` : "営業時間の登録がありません。"} Googleマップで確認してね</p>`}
    </div>
    ${sv ? `
    <div class="sec"><h3>わたしのメモ</h3>
      <div class="status3" role="group" aria-label="行った？">
        <button data-st="want" aria-pressed="${sv.status !== "been"}">行きたい</button>
        <button data-st="been" aria-pressed="${sv.status === "been"}">行った</button>
      </div>
      ${stars("taste", "味")}${stars("mood", "雰囲気")}
      <div class="stars"><label for="sweetsChk">スイーツ推し</label><input type="checkbox" id="sweetsChk" ${sv.sweets ? "checked" : ""}></div>
      <textarea id="memo" rows="3" placeholder="頼んだもの、また食べたいもの、席の感じなど">${esc(sv.memo || "")}</textarea>
      ${askDelete ? `<div class="confirm">保存とメモを消しますか？ <button id="delYes">消す</button><button id="delNo" style="border-color:var(--line);color:var(--muted)">やめる</button></div>`
        : `<button class="linkish" id="delBtn">保存をやめる</button>`}
    </div>` : ""}
    ${c.web ? `<div class="sec"><a class="small" href="${esc(c.web)}" target="_blank" rel="noopener">お店のサイト</a></div>` : ""}
  `;
  $("saveBtn").onclick = () => {
    if (sv) { askDelete = true; drawSheet(); return; }
    store.saved[c.id] = { info: { ...c }, status: "want", taste: 0, mood: 0, sweets: false, memo: "", at: Date.now() };
    persist(); toast("保存しました"); drawSheet();
  };
  if (!sv) return;
  $("sheet").querySelectorAll("[data-st]").forEach((b) => (b.onclick = () => { sv.status = b.dataset.st; persist(); drawSheet(); }));
  $("sheet").querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => {
    const n = +b.dataset.n; sv[b.dataset.k] = sv[b.dataset.k] === n ? 0 : n; persist(); drawSheet();
  }));
  $("sweetsChk").onchange = (e) => { sv.sweets = e.target.checked; persist(); };
  $("memo").oninput = (e) => { sv.memo = e.target.value; clearTimeout(drawSheet._m); drawSheet._m = setTimeout(persist, 400); };
  $("memo").onblur = persist;
  if ($("delBtn")) $("delBtn").onclick = () => { askDelete = true; drawSheet(); };
  if ($("delYes")) $("delYes").onclick = () => { delete store.saved[c.id]; persist(); toast("保存をやめました"); askDelete = false; drawSheet(); };
  if ($("delNo")) $("delNo").onclick = () => { askDelete = false; drawSheet(); };
}

// ---------- 操作 ----------
function setView(v) {
  view = v;
  $("vMap").setAttribute("aria-pressed", v === "map"); $("vList").setAttribute("aria-pressed", v === "list");
  $("map").hidden = v !== "map"; $("list").hidden = v !== "list";
  $("redo").hidden = true;
  if (v === "map") setTimeout(() => map.invalidateSize(), 0);
  try { localStorage.setItem(KEY + ".view", v); } catch (e) {}
}
$("vMap").onclick = () => setView("map");
$("vList").onclick = () => setView("list");
const chip = (id, key) => ($(id).onclick = () => { filters[key] = !filters[key]; $(id).setAttribute("aria-pressed", filters[key]); render(); });
chip("fOpen", "open"); chip("fSaved", "saved"); chip("fSweets", "sweets");
const radiusLabel = () => { $("fRadius").textContent = `半径 ${store.radius >= 1000 ? store.radius / 1000 + "km" : store.radius + "m"}`; };
$("fRadius").onclick = () => {
  store.radius = RADII[(RADII.indexOf(store.radius) + 1) % RADII.length]; persist(); radiusLabel();
  if (center) searchCafes(center);
};
$("locBtn").onclick = locate;
$("redo").onclick = () => { const c = map.getCenter(); $("where").textContent = "地図の中心のまわり"; searchCafes({ lat: c.lat, lon: c.lng }); };
$("searchForm").addEventListener("submit", (e) => { e.preventDefault(); const t = $("q").value.trim(); if (t) { $("q").blur(); geocode(t); } });

// 1分ごとに営業中表示を更新
setInterval(() => { render(); if (current) drawSheet(); }, 60000);

radiusLabel();
try { const v = localStorage.getItem(KEY + ".view"); if (v === "list") setView("list"); } catch (e) {}
render();
locate();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
